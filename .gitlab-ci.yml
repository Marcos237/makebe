variables:
  CI_SERVER_URL: http://makebe-gitlab

stages:
  - build
  - deploy
  - deploy-Prod

build:
  stage: build
  image: node:20.9.0
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - build/
  tags:
    - docker
  only:
    - main

deploy:
  stage: deploy
  image: docker:25.0.2  
  before_script:

    - apk update && apk add --no-cache sshpass
  script:
    - docker pull makebe:latest || true
    - docker build -t makebe:latest .
    - docker stop makebe || true
    - docker rm makebe || true
    - docker run -d --name makebe -p 8081:80 \
        -v /etc/localtime:/etc/localtime:ro \
        -v /mnt/arquivos/makebeserver/dockercompose/sites/config/makebe:/app/src/config/ \
        makebe:latest
    - docker network connect dockercompose_makebe-rede makebe || true

    - |
      sshpass -p "$DOCKER_PASSWORD" ssh -o StrictHostKeyChecking=no "$DOCKER_USER@$DOCKER_NETWORK" "
        docker cp makebe:/app /home/makebe-user/sites/makebe
      "
  tags:
    - docker
  only:
    - main
  when: manual     
  environment:
    name: homolog         

deploy-Prod:
  stage: deploy-Prod
  image: alpine:latest
  needs: ["build"]    
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$AWS_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts
    - export AWS_PATH_CLEAN="$(printf '%s' "$AWS_PATH")"
  script:
    - ssh "$AWS_USER@$AWS_HOST" "mkdir -p \"$AWS_PATH_CLEAN/build\""
    - scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -r build/* "$AWS_USER@$AWS_HOST:$AWS_PATH_CLEAN/build/"
    - ssh "$AWS_USER@$AWS_HOST" "cd \"$AWS_PATH_CLEAN\" && docker compose up -d"
        -v /etc/localtime:/etc/localtime:ro \
        -v /makebe/app/config:/app/src/config/ \
  tags: [docker]
  only: [main]
  when: manual
  environment:
    name: production




