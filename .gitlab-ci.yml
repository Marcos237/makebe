variables:
  CI_SERVER_URL: http://makebe-gitlab

stages:
  - build
  - deploy

build:
  stage: build
  image: node:20.9.0
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - build/
  tags:
    - docker

deploy:
  stage: deploy
  image: docker:25.0.2,
  before_script:
    - apk update && apk add --no-cache rsync
  script:
    - docker pull makebe:latest || true
    - docker build -t makebe:latest .
    - docker stop makebe || true
    - docker rm makebe || true
    - docker run -d --name makebe -p 8080:80 makebe:latest
    - docker network connect dockercompose_makebe-rede makebe
  tags:
    - docker
  only:
    - main
