variables:
  CI_SERVER_URL: http://makebe-gitlab

stages:
  - build
  - deploy

before_script:
  - apt-get update && apt-get install -y rsync

build:
  stage: build
  image: node:20.9.0
  script:
    - npm install --loglevel=error
    - npm run build --loglevel=error
  artifacts:
    paths:
      - build/
  tags:
    - docker

deploy:
  stage: deploy
  image: ubuntu:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apt-get update && apt-get install -y rsync docker.io
    - docker --version
  script:
    - echo "$DOCKER_AUTH_CONFIG" | docker login --username "$DOCKER_USERNAME" --password-stdin
    - docker pull makebe:latest || true
    - docker build -t makebe:latest .
    - docker stop makebe || true
    - docker rm makebe || true
    - docker run -d --name makebe -p 80:80 makebe:latest
    - docker network connect dockercompose_makebe-rede makebe
  tags:
    - docker
  only:
    - main
