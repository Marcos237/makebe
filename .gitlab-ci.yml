variables:
  CI_SERVER_URL: http://makebe-gitlab

stages:
  - build
  - deploy

build:
  stage: build
  image: node:20.9.0
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - build/
  tags:
    - docker

deploy:
  stage: deploy
  image: docker:25.0.2
before_script:
    - apk update && apk add --no-cache rsync openssh-client sshpass
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$DOCKER_NETWORK" >> ~/.ssh/known_hosts
script:
    - |
      sshpass -p "$DOCKER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SDOCKER_USER@$DOCKER_NETWORK" "
      docker pull makebe:latest || true
      docker build -t makebe:latest .
      docker stop makebe || true
      docker rm makebe || true
      docker run -d --name makebe -p 8081:80 -v /etc/localtime:/etc/localtime:ro makebe:latest
      docker network connect dockercompose_makebe-rede makebe || true
      docker cp :/app /home/makebe-user/sites/makebe
      "
tags:
    - docker
only:
    - main
