variables:
  CI_SERVER_URL: http://makebe-gitlab

stages:
  - build
  - deploy

build:
  stage: build
  image: node:20.9.0
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - build/
  tags:
    - docker

deploy:
  stage: deploy
  image: docker:25.0.2
  before_script:
    - apk update && apk add --no-cache rsync
  script:
    - docker exec makebe-nginx nginx -s reload
  tags:
    - docker
  only:
    - main
