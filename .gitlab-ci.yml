variables:
  CI_SERVER_URL: http://makebe-gitlab
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375

stages:
  - build
  - deploy

build:
  stage: build
  image: node:20.9.0
  script:
    - yarn install
    - yarn build

  tags:
    - docker

  artifacts:
    paths:
      - build/
    
  before_script:
    - apt-get update && apt-get install -y rsync

deploy:
  stage: deploy
  image: docker:stable

  script:
    - apt-get update && apt-get install -y rsync 
    - docker pull makebe-front:latest || true  
    - docker build -t makebe-front:latest . 
    - docker stop makebe || true  
    - docker rm makebe || true     
    - docker run -d --name makebe -p 80:80 makebe:latest
    - docker network connect dockercompose_makebe-rede makebe 
  tags:
    - docker
  only:
    - main  
