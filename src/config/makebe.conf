worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name makebe2.com.br;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }
}
